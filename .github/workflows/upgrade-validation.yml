name: Phinx 5 upgrade validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / lowest=${{ matrix.prefer-lowest }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '6.4.*', prefer-lowest: false, experimental: false }
          - { php: '8.1', symfony: '6.4.*', prefer-lowest: true, experimental: false }
          - { php: '8.2', symfony: '6.4.*', prefer-lowest: false, experimental: false }
          - { php: '8.2', symfony: '^7.0', prefer-lowest: false, experimental: false }
          - { php: '8.3', symfony: '^7.0', prefer-lowest: false, experimental: false }
          - { php: '8.4', symfony: '^7.0', prefer-lowest: false, experimental: false }
          - { php: '8.5', symfony: '6.4.*', prefer-lowest: false, experimental: false }
          - { php: '8.5', symfony: '^7.0', prefer-lowest: false, experimental: false }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 13306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2

      - name: Check Version
        run: |
          php -v
          php -m
          composer -V

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composercache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache vendor
        uses: actions/cache@v4
        env:
          cache-name: composer-cache
        with:
          path: ${{ steps.composercache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-build-${{ env.cache-name }}

      - name: Install dependencies (latest)
        if: false == matrix.prefer-lowest
        run: composer update --prefer-dist --no-progress --with "symfony/config:${{ matrix.symfony }}" --with "symfony/console:${{ matrix.symfony }}"

      - name: Install dependencies (prefer-lowest)
        if: true == matrix.prefer-lowest
        run: composer update --prefer-dist --no-progress --with "symfony/config:${{ matrix.symfony }}" --with "symfony/console:${{ matrix.symfony }}" --prefer-lowest --prefer-stable

      - name: Show resolved bridge and Symfony versions
        run: |
          composer show zxin/think-symfony-bridge --format=json
          composer show symfony/config
          composer show symfony/console

      - name: Audit installed dependencies
        run: composer audit

      - name: Check Composer autoload isolation
        run: composer test:autoload

      - name: Run test suite
        run: composer exe phpunit -- -v
        env:
          TESTS_DB_MYSQL_HOST: 127.0.0.1
          TESTS_DB_MYSQL_PORT: 13306
          TESTS_DB_MYSQL_USERNAME: root
          TESTS_DB_MYSQL_PASSWORD: password
          TESTS_DB_MYSQL_DATABASE: testing
